<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
    <title>Snake Game</title>
</head>
<body>
    <h1>SNAKE GAME!</h1>
    <div class="controls diff">
        <button id="diff_easy" type="button">Easy</button>
        <button id="diff_normal" type="button">Normal</button>
        <button id="diff_hard" type="button">Hard</button>
    </div>
    <div class="controls">
        <label>snake:
            <select id="snakeSelect">
                <option value="verdao">Verdão</option>
                <option value="coral">Coral</option>
                <option value="jararaca">Jararaca</option>
                <option value="piton">Píton</option>
                <option value="naja">Naja</option>
                <option value="brasa">Brasa</option>
            </select>
        </label>
        <label>speed: <input id="speed" min="30" max="230" type="range" step="10" value="130"></label>
        <button id="wallToggle" type="button">Walls: OFF</button>
        <button id="muteToggle" type="button">Sound: ON</button>
        <button id="fsToggle" type="button">Fullscreen</button>
        <button id="lbBtn" type="button">Ranking</button>
    </div>
    <canvas id="snake" width="800" height="448"></canvas>
</body>
</html>
